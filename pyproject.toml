[project]
name = "reasoning-llm"
version = "0.1.0"
description = "Open, trustworthy verifier-and-environment harness for reasoning-model RLVR — the first open implementation of verifier exploitability as a controlled independent variable."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Huy Hoang Dang" }]
keywords = ["rlvr", "grpo", "reward-hacking", "verifier-exploitability", "reasoning", "llm"]

# Kept intentionally lean (PRINCIPLES.md: dependency minimalism). Heavy, GPU-bound
# deps (torch, triton, sglang, vllm) are pulled per-environment, not pinned here,
# so CI stays fast and the core logic (metrics, advantages, detectors) is testable
# on CPU with numpy alone.
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "regex>=2024.0",   # GPT-2 pretokenization needs \p{L}/\p{N}; stdlib re cannot
]

[project.optional-dependencies]
# Installed on the GPU box, not in CI. `uv pip install -e ".[gpu]"`
gpu = [
    "torch>=2.4",
    "transformers>=4.44",
    "datasets>=2.20",
]
# `uv pip install -e ".[dev]"`
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pyright>=1.1.380",
]

[project.urls]
Homepage = "https://github.com/USERNAME/reasoningLLM"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reasoning_llm"]

# ---------------------------------------------------------------------------
# Discipline harness (UNIFIED_FRONTIER_PROJECT_SPEC §5/§6: engineering quality
# IS the differentiator; weak engineering is the most common silent rejection).
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # line length enforced softly; long math/comments allowed

[tool.ruff.lint.per-file-ignores]
# The Triton kernel import must follow `pytest.importorskip("triton")` (so the module skips on a
# CPU box) — that intentionally breaks import-at-top (E402) and the import sorter (I001).
"tests/test_flash_attention_triton.py" = ["E402", "I001"]

[tool.pyright]
include = ["src", "tests"]
# Triton kernels use the `kernel[grid](...)` launch syntax static checkers can't model, and run
# only on a GPU box — type-checked there by execution, not here.
exclude = ["src/reasoning_llm/kernels/flash_attention_triton.py"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingImports = false   # GPU-only deps absent in CI

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "gpu: requires a GPU / heavy deps (skipped in CI)",
    "slow: long-running ablation, not part of the smoke gate",
]
