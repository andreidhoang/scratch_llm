[project]
name = "scratch-llm"
version = "0.1.0"
description = "A from-scratch, production-grade implementation of the CS336 (Stanford 'Language Modeling from Scratch') stack — BPE, Transformer, systems, scaling, data, and RL post-training, owned end to end."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Huy Hoang Dang" }]
keywords = ["cs336", "transformer", "language-model", "from-scratch", "bpe", "flash-attention", "grpo", "rlhf"]

# Kept intentionally lean (PRINCIPLES.md: dependency minimalism). Heavy, GPU-bound
# deps (torch, triton, sglang, vllm) are pulled per-environment, not pinned here,
# so CI stays fast and the core logic (numerics, BPE, advantages, monitors) is
# testable on CPU with numpy alone.
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "regex>=2024.0",   # GPT-2 pretokenization needs \p{L}/\p{N}; stdlib re cannot
]

[project.optional-dependencies]
# Installed on the GPU box, not in CI. `uv pip install -e ".[gpu]"`
gpu = [
    "torch>=2.4",
    "transformers>=4.44",
    "datasets>=2.20",
]
# AOT kernel build — the rental-box frontier-kernel path (CMake + CUDA arch list).
# `TORCH_CUDA_ARCH_LIST="9.0a;10.0a" pip install -e ".[gpu-aot]"` builds csrc/*.cu
# into the `_scratch_llm_kernels` torch extension. CPU-only CI never installs this.
gpu-aot = [
    "torch>=2.4",
    "ninja",
]
# `uv pip install -e ".[dev]"`
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pyright>=1.1.380",
]
# A4 data-pipeline extras (`uv pip install -e ".[data]"`). Tests importorskip these,
# so the CPU commit gate stays hermetic without them.
data = [
    "fastwarc>=0.14",
    "resiliparse>=0.14",
    "fasttext>=0.9.3",
    "pyarrow>=15",     # F1-data parquet bulk ingest (shards.py streaming path)
]
# A3 plots + robust fits (`uv pip install -e ".[scaling]"`); core fitter is numpy-only.
scaling = [
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[project.urls]
Homepage = "https://github.com/andreidhoang/scratch_llm"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scratch_llm"]

# ---------------------------------------------------------------------------
# Discipline harness. Engineering quality is the hiring signal frontier labs
# silently screen for: weak engineering is the most common silent rejection of
# otherwise-promising candidates. ruff + pyright + pytest gate every commit.
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "bench"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # line length enforced softly; long math/comments allowed

[tool.ruff.lint.per-file-ignores]
# The Triton kernel import must follow `pytest.importorskip("triton")` (so the module skips on a
# CPU box) — that intentionally breaks import-at-top (E402) and the import sorter (I001).
# Kernel benches under bench/kernels/ resolve bench/ + src/ on sys.path at runtime (move-proof
# `_harness.py` lookup), so their E402 (import-not-at-top) is intentional too.
"tests/kernels/test_flash_attention_triton.py" = ["E402", "I001"]
"tests/kernels/test_flash_attention_fa3.py" = ["E402", "I001"]
# E001/mastery instrument: `O` (output) and `I` (identity) are the symbols of the gated delta
# rule as written in reference.py's docstring — `S_t = a_t (I - b_t k k^T) S_{t-1} + b_t k v^T`.
# Here E741's premise is inverted: matching the equation is what makes these names unambiguous,
# and equation-to-code correspondence is the whole point of the oracle. Scoped to these files
# only — E741 still binds everywhere else, where `l`/`O`/`I` genuinely do read as `1`/`0`.
"src/scratch_llm/mastery/*.py" = ["E741"]
"tests/test_wy_identity.py" = ["E741"]
"tests/test_e001_regression.py" = ["E741"]
"bench/kernels/**/*.py" = ["E402"]
"scripts/analyze_s35.py" = ["E402"]
"scripts/f6_moe_ablation.py" = ["E402"]
"scripts/f12_corpus_ablation.py" = ["E402"]
"scripts/resume_climbmix_only.py" = ["E402"]
"scripts/rebuild_arm_tokenizer.py" = ["E402"]
"scripts/s3_scaling_sweep.py" = ["E402"]
"scripts/stage_s3_corpus.py" = ["E402"]
"scripts/tok_train.py" = ["E402"]

[tool.pyright]
include = ["src", "tests"]
# Triton kernels use the `kernel[grid](...)` launch syntax static checkers can't model, and run
# only on a GPU box — type-checked there by execution, not here. Same for JIT-loaded CUDA modules
# (cpp_extension.load / load_inline return an opaque pybind handle). Paths mirror the
# kernels/<family>/<backend>/ tree (ADR-0011); GPU benches under bench/kernels/ are excluded for
# the same reason (Triton launch + sibling `_harness` import resolved at runtime, not statically).
exclude = [
    # Triton @jit kernel bodies + launchers (attention, gemm/triton, norm, reduce)
    "src/scratch_llm/kernels/attention/prefill/fa2.py",
    "src/scratch_llm/kernels/attention/prefill/fa2_tuned_triton.py",
    "src/scratch_llm/kernels/attention/decode/paged.py",
    "src/scratch_llm/kernels/gemm/triton/tiled.py",
    "src/scratch_llm/kernels/gemm/triton/gemv.py",
    "src/scratch_llm/kernels/norm/normalize.py",
    "src/scratch_llm/kernels/reduce/softmax.py",
    "src/scratch_llm/kernels/reduce/topk.py",
    # CUDA C++ JIT loaders (mma.sync / smem-tiled via cpp_extension.load; wmma via load_inline)
    "src/scratch_llm/kernels/gemm/cuda/mma_sync.py",
    "src/scratch_llm/kernels/gemm/cuda/smem_tiled.py",
    "src/scratch_llm/kernels/gemm/wmma/gemm.py",
    # Frontier CUDA C++ loaders (WGMMA/tcgen05/FA3 promoted; fp8/stream_k/persistent stubs).
    # Same reason as mma.sync above: opaque pybind handles static checkers cannot model.
    "src/scratch_llm/kernels/gemm/cuda/wgmma.py",
    "src/scratch_llm/kernels/gemm/cuda/tcgen05.py",
    "src/scratch_llm/kernels/gemm/cuda/fp8.py",
    "src/scratch_llm/kernels/gemm/cuda/stream_k.py",
    "src/scratch_llm/kernels/gemm/cuda/persistent.py",
    "src/scratch_llm/kernels/attention/prefill/fa3.py",
    # CuTe DSL (K1 B-R5): the kernel is Python decorated with @cute.experimental.jit/.kernel, and
    # `cute` is imported lazily inside the function so the module stays importable on a box with no
    # nvidia-cutlass-dsl. pyright then sees a module-typed VARIABLE in the annotations
    # (`mA: cute.Tensor`) and an opaque compiled object at the call site — the same thing it cannot
    # model for Triton's `kernel[grid](...)`. Type-checked there by execution, on a B200.
    "src/scratch_llm/kernels/gemm/cute_dsl/b_r5.py",
    # GPU benches: Triton launch + runtime sys.path resolution of bench/_harness.py
    "bench/kernels",
    # GPU tests that drive the above
    "tests/kernels/test_flash_attention_triton.py",
    "tests/kernels/test_flash_attention_fa3.py",
    "tests/kernels/test_gemm_wgmma.py",
    "tests/kernels/test_gemm_tcgen05.py",
    "tests/kernels/test_gemm_fp8.py",
    "tests/kernels/test_gemm_stream_k.py",
    "tests/kernels/test_persistent_gemv.py",
]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingImports = false   # GPU-only deps absent in CI

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]   # src/ layout: import scratch_llm without relying on the editable .pth
addopts = "-q --strict-markers"
markers = [
    "gpu: requires a GPU / heavy deps (skipped in CI)",
    "slow: long-running ablation, not part of the smoke gate",
    "network: needs internet (self-skips unless SCRATCH_LLM_NETWORK_TESTS=1)",
    "hole: guards one `# HUY:` hole — strict-xfail while the hole is open (tests/conftest.py)",
    "drydock: asserts on ptxas/SASS captured by infra/drydock.sh; skips when the file is absent",
]
