[project]
name = "scratch-llm"
version = "0.1.0"
description = "A from-scratch, production-grade implementation of the CS336 (Stanford 'Language Modeling from Scratch') stack — BPE, Transformer, systems, scaling, data, and RL post-training, owned end to end."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Huy Hoang Dang" }]
keywords = ["cs336", "transformer", "language-model", "from-scratch", "bpe", "flash-attention", "grpo", "rlhf"]

# Kept intentionally lean (PRINCIPLES.md: dependency minimalism). Heavy, GPU-bound
# deps (torch, triton, sglang, vllm) are pulled per-environment, not pinned here,
# so CI stays fast and the core logic (numerics, BPE, advantages, monitors) is
# testable on CPU with numpy alone.
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "regex>=2024.0",   # GPT-2 pretokenization needs \p{L}/\p{N}; stdlib re cannot
]

[project.optional-dependencies]
# Installed on the GPU box, not in CI. `uv pip install -e ".[gpu]"`
gpu = [
    "torch>=2.4",
    "transformers>=4.44",
    "datasets>=2.20",
]
# `uv pip install -e ".[dev]"`
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pyright>=1.1.380",
]
# A4 data-pipeline extras (`uv pip install -e ".[data]"`). Tests importorskip these,
# so the CPU commit gate stays hermetic without them.
data = [
    "fastwarc>=0.14",
    "resiliparse>=0.14",
    "fasttext>=0.9.3",
]
# A3 plots + robust fits (`uv pip install -e ".[scaling]"`); core fitter is numpy-only.
scaling = [
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[project.urls]
Homepage = "https://github.com/andreidhoang/scratch_llm"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scratch_llm"]

# ---------------------------------------------------------------------------
# Discipline harness. Engineering quality is the hiring signal frontier labs
# silently screen for: weak engineering is the most common silent rejection of
# otherwise-promising candidates. ruff + pyright + pytest gate every commit.
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # line length enforced softly; long math/comments allowed

[tool.ruff.lint.per-file-ignores]
# The Triton kernel import must follow `pytest.importorskip("triton")` (so the module skips on a
# CPU box) — that intentionally breaks import-at-top (E402) and the import sorter (I001).
"tests/test_flash_attention_triton.py" = ["E402", "I001"]

[tool.pyright]
include = ["src", "tests"]
# Triton kernels use the `kernel[grid](...)` launch syntax static checkers can't model, and run
# only on a GPU box — type-checked there by execution, not here.
exclude = [
    "src/scratch_llm/kernels/flash_attention_triton.py",
    "src/scratch_llm/kernels/paged_decode_triton.py",
    "src/scratch_llm/kernels/gemv_triton.py",
    "src/scratch_llm/kernels/matmul.py",
    "src/scratch_llm/kernels/bench.py",
    "src/scratch_llm/kernels/inference",
    "tests/test_matmul.py",
    "tests/test_flash_attention_triton.py",
]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingImports = false   # GPU-only deps absent in CI

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]   # src/ layout: import scratch_llm without relying on the editable .pth
addopts = "-q --strict-markers"
markers = [
    "gpu: requires a GPU / heavy deps (skipped in CI)",
    "slow: long-running ablation, not part of the smoke gate",
]
