name: ci

# Green CI from day one. HW-agnostic (CPU torch, no GPU): lint + types + tests.
# This job MIRRORS the local commit hook (.claude/hooks/green-ci-gate.sh): the exact
# `pytest -m "not gpu"` floor. GPU-marked tests are skipped here and run on the GPU box.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      # A real venv, not `--system`: the runner's /usr interpreter is PEP-668
      # externally-managed, so `uv pip install --system` fails ("externally managed").
      # Put .venv/bin on PATH for every later step via $GITHUB_PATH.
      - name: Set up Python + venv
        run: |
          uv python install 3.11
          uv venv --python 3.11
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"

      # torch is not a core/[dev] dep (it is pulled per-environment), but the `not gpu`
      # suite imports it — install the CPU-only wheel so CI runs the same tests the hook does.
      # `scaling` is here for a REASON, not convenience: tests/test_analyze_s35.py exercises the
      # IsoFLOP fit/verdict logic, and scripts/analyze_s35.py imports matplotlib at module level
      # (it must, so `matplotlib.use("Agg")` runs before pyplot on a headless runner). Installing
      # only `.[dev]` made those 6 tests pass locally and fail in CI — a hermeticity gap, not a
      # flake. Extras the suite actually needs belong in the CI install, not in the dev's shell.
      - name: Install (dev + scaling + CPU torch)
        run: |
          uv pip install -e ".[dev,scaling]"
          uv pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Ruff (lint + import order)
        run: ruff check src tests bench/kernels experiments/plot_e001.py

      - name: Ruff (format check)
        run: ruff format --check src tests bench/kernels experiments/plot_e001.py

      - name: Pyright (types)
        run: pyright

      - name: Pytest (CPU gate — mirrors the commit hook)
        # `hole` = a block deliberately left unimplemented for Huy (tests/conftest.py); it is a
        # strict xfail, not a failure, but excluding it keeps the CI signal about regressions.
        # `drydock` asserts on ptxas/SASS artifacts produced by infra/drydock.sh, which needs nvcc.
        run: pytest -m "not gpu and not slow and not hole and not drydock" --cov=scratch_llm

  # Optional GPU-AOT build job — verifies the CMake / setup.py AOT build compiles
  # for the rental frontier archs (sm_90a, sm_100a). Runs ONLY when the `gpu-aot`
  # label is applied to a PR (or on a self-hosted GPU runner). continue-on-error so
  # the CPU job stays green even if the GPU build environment is unavailable.
  # This is the "did the csrc/ tree stay compile-clean?" guardrail.
  gpu-aot-build:
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'gpu-aot')
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install CUDA toolkit (nvcc)
        uses: Jimver/cuda-toolkit@v0.2.21
        with:
          cuda: '12.4.0'
          method: network

      - name: Install uv + Python
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python + venv
        run: |
          uv python install 3.11
          uv venv --python 3.11
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"

      - name: Install (gpu-aot extra — torch + ninja)
        run: uv pip install -e ".[gpu-aot]"

      - name: Build AOT extension for sm_90a (compile-only — no GPU to run)
        run: |
          TORCH_CUDA_ARCH_LIST="9.0a" python setup.py build_ext --inplace
          python -c "from scratch_llm import _scratch_llm_kernels; print(dir(_scratch_llm_kernels))"
